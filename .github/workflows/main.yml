name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install --legacy-peer-deps
        working-directory: ./zip

      - name: Add android if missing
        run: |
          if [! -d "android" ]; then
            npx cap add android
          fi
        working-directory: ./zip

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ./zip

      - name: Build APK
        run: |
          chmod +x gradlew ./gradlew assembleDebug --no-daemon
        working-directory: ./zip/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-debug-apk
          path: ./zip/android/app/build/outputs/apk/debug/app-debug.apk
